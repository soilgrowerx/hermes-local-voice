name: hermes-local-voice
version: 0.1.0
author: George Steward
description: Offline voice capture and transcription for Hermes Agent using faster-whisper and PipeWire or ffmpeg.
requires_hermes: ">=0.21.5"
license: MIT
python_runtime: external
provides_tools:
  - transcribe_audio
  - voice_record_start
  - voice_record_stop
  - transcribe_last
provides_hooks:
  - pre_llm_call
config_schema:
  model_size:
    type: str
    default: "base.en"
    description: "Whisper model identifier (tiny.en, base.en, small.en, medium.en, large-v3-turbo)."
  compute_type:
    type: str
    default: "int8"
    description: "CTranslate2 compute precision (int8, float16, float32)."
  language:
    type: str
    default: "en"
    description: "Language code for transcription (for example en) or auto for detection."
  model_dir:
    type: str
    default: ""
    description: "Directory for cached Whisper models. Defaults to HERMES_HOME/plugin-data/hermes-local-voice/models."
  max_file_mb:
    type: int
    default: 100
    description: "Maximum accepted audio file size in megabytes."
  server_url:
    type: str
    default: ""
    description: "Optional local faster-whisper job server URL. Empty means no server is contacted; 8001 is a common dev-server port, so never default to it."
  prefer_server:
    type: bool
    default: false
    description: "Contact server_url before loading faster-whisper directly. Only honoured when server_url is set."
  auto_transcribe_inbound:
    type: bool
    default: false
    description: "Legacy opt-in. Runs in pre_gateway_dispatch BEFORE sender authorization, so any stranger on a connected platform can trigger transcription. Prefer setting stt.provider to hermes_local_voice."
